name: Import original lab evidence

on:
  push:
    paths:
      - '.github/workflows/import-evidence.yml'

permissions:
  contents: write

jobs:
  import-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out new repository
        uses: actions/checkout@v4

      - name: Install image support
        run: python -m pip install --quiet pillow

      - name: Find exact screenshots in old repository history
        shell: bash
        run: |
          set -e
          git clone --mirror https://github.com/RAY883/Enterprise-Active-Directory-Splunk-Lab.git /tmp/old.git
          mkdir -p evidence

          cat > /tmp/import_images.py <<'PY'
          import hashlib
          import io
          import os
          import subprocess
          from PIL import Image

          targets = {
              "67377ae1de5f39ea230c7c75a51f71983817e771c682d3538284cb743b15eba2": "01-virtualbox-lab-environment.png",
              "3fd925b4b7f4c7b4fa76f95f933d1fc855866240581863e3a812dbcd0659d5d1": "02-active-directory-domain.png",
              "e98428984600b57f700f55ed671146530a332b7f314c4d95ecf290342b608e4c": "03-detailed-windows-events.png",
              "d61fcb3b219c5185ee212e6308ef2445e023a566a49972fb323bb5cc44825c65": "04-splunk-receiving-port-9997.png",
              "1b43fbad699b51dd4c9b8772c443b6a59393b24327f1aa4e8c76b2e990a94e47": "05-universal-forwarder-running.png",
              "f0a987ea33ddff5eb668c695ef2c52d30edacbc5e672afc0e4b0d5b249ca75b4": "06-splunk-event-search-results.png",
              "63f09db2cc37e5dac9489c426e46d14b444db4c6e19258c707b60ee7079e6191": "07-forwarder-output-configuration.png",
          }

          found = {}
          seen = set()
          output = subprocess.check_output(
              ["git", "--git-dir=/tmp/old.git", "rev-list", "--objects", "--all"],
              text=True,
          )

          for line in output.splitlines():
              parts = line.split(" ", 1)
              object_id = parts[0]
              path = parts[1] if len(parts) == 2 else ""
              if object_id in seen:
                  continue
              seen.add(object_id)
              if not path.lower().endswith((".png", ".webp", ".jpg", ".jpeg")):
                  continue
              try:
                  object_type = subprocess.check_output(
                      ["git", "--git-dir=/tmp/old.git", "cat-file", "-t", object_id],
                      text=True,
                  ).strip()
                  if object_type != "blob":
                      continue
                  data = subprocess.check_output(
                      ["git", "--git-dir=/tmp/old.git", "cat-file", "-p", object_id]
                  )
                  image = Image.open(io.BytesIO(data)).convert("RGBA")
                  pixel_hash = hashlib.sha256(image.tobytes()).hexdigest()
              except Exception:
                  continue

              if pixel_hash in targets and pixel_hash not in found:
                  destination = os.path.join("evidence", targets[pixel_hash])
                  image.save(destination, format="PNG", optimize=True)
                  found[pixel_hash] = path
                  print(f"Matched {destination} from {path}")

              if len(found) == len(targets):
                  break

          missing = [targets[key] for key in targets if key not in found]
          with open("IMPORT_REPORT.md", "w", encoding="utf-8") as report:
              report.write("# Evidence Import Report\n\n")
              report.write(f"Matched {len(found)} of {len(targets)} original screenshots.\n\n")
              if missing:
                  report.write("## Missing\n\n")
                  for item in missing:
                      report.write(f"- {item}\n")
              else:
                  report.write("All seven original screenshots were recovered with matching pixel hashes.\n")

          if missing:
              print("Missing screenshots:", ", ".join(missing))
          PY

          python /tmp/import_images.py

      - name: Commit recovered evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/import-evidence.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m "Import original lab evidence screenshots"
          git push
